[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "riptidekv-server"
path = "src/main.rs"

[[bench]]
name = "server_bench"
harness = false

[dependencies]
engine       = { path = "../engine" }
anyhow       = "1.0"
thiserror    = "1.0"
tokio        = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "signal", "time"] }
bytes        = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile  = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
